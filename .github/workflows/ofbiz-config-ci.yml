# Dosya Yolu: /.github/workflows/ofbiz-config-ci.yml
# Amac: OFBiz konfigurasyon araclarinin statik CI dogrulamasini calistirir
# Tool - YAML
# Version: 1.0.0
# Aciklama: OFBIZ degisikliklerinde Bash syntax, ShellCheck, struktur ve resolver testlerini kosar
#
# Bagimli Oldugu Katman: Tool | Controller | Service | Repo | Config

name: OFBiz Config CI

on:
  push:
    branches:
      - master
    paths:
      - "OFBIZ/**"
      - ".github/workflows/ofbiz-config-ci.yml"
  pull_request:
    paths:
      - "OFBIZ/**"
      - ".github/workflows/ofbiz-config-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OFBiz config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate structure and syntax
        shell: bash
        run: bash OFBIZ/tools/ci/validate-structure.sh

      - name: ShellCheck active scripts
        shell: bash
        run: |
          find OFBIZ/controllers OFBIZ/services OFBIZ/repositories OFBIZ/tools             -type f -name '*.sh'             -not -path '*/legacy/*'             -print0             | xargs -0 shellcheck -S error -e SC1090,SC1091
