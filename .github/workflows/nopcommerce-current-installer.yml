# 📄 Dosya Yolu: /.github/workflows/nopcommerce-current-installer.yml
# 📌 Amac: NopCommerce cok surumlu installer dosyalarinin shell, config, surum cozumleme ve template butunlugunu CI uzerinde dogrulamak
# 📌 Modul - YAML
# Version: 1.1.0
# Aciklama: bash syntax, config, surum katalogu ve template kontrollerini calistirir
# Bagimli Oldugu Katman: Repo | Tool | View | Config | Language

name: NopCommerce Current Installer

on:
  pull_request:
    paths:
      - "NopCommerce/current/installer/**"
      - "NopCommerce/current/README.md"
      - ".github/workflows/nopcommerce-current-installer.yml"
  push:
    branches:
      - master
    paths:
      - "NopCommerce/current/installer/**"
      - "NopCommerce/current/README.md"
      - ".github/workflows/nopcommerce-current-installer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          find NopCommerce/current/installer \
            -type f \
            -name "*.sh" \
            -print0 | while IFS= read -r -d "" file; do
              bash -n "$file"
            done

          bash -n NopCommerce/current/installer/config/installer.env.example
          bash -n NopCommerce/current/installer/config/version-catalog.env
          bash -n NopCommerce/current/installer/language/tr.labels

      - name: Validate config load
        shell: bash
        run: |
          set -Eeuo pipefail

          source NopCommerce/current/installer/config/installer.env.example
          source NopCommerce/current/installer/config/version-catalog.env
          source NopCommerce/current/installer/language/tr.labels

          test -n "$NOP_DEFAULT_VERSION"
          test -n "$NOP_RELEASE_API_BASE"
          test -n "$NOP_DOTNET_ROOT"
          test -n "$NOP_SUPPORTED_VERSION_FAMILIES"
          test -n "$NOP_RUNTIME_CHANNELS"
          test -n "$MSG_START"
          test -n "$ERR_VERSION"

      - name: Validate version resolver
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"

          version_repository_resolve "4.30"
          test "$NOP_VERSION" = "4.30"
          test "$NOP_DOTNET_RUNTIME_CHANNEL" = "3.1"

          version_repository_resolve "latest-4.60"
          test "$NOP_VERSION" = "4.60.6"
          test "$NOP_DOTNET_RUNTIME_CHANNEL" = "7.0"

          version_repository_resolve "4.80.9"
          test "$NOP_VERSION" = "4.80.9"
          test "$NOP_DOTNET_RUNTIME_CHANNEL" = "9.0"

          if version_repository_resolve "4.10"; then
            exit 1
          fi

      - name: Validate templates
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q "__APP_DIR__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__DOTNET_EXECUTABLE__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__DOTNET_ROOT__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__ASPNETCORE_URLS__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__PUBLIC_HOST__" NopCommerce/current/installer/config/nginx.conf.tpl
          grep -q "__UPSTREAM__" NopCommerce/current/installer/config/nginx.conf.tpl
