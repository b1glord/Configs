# 📄 Dosya Yolu: /.github/workflows/nopcommerce-current-installer.yml
# 📌 Amac: NopCommerce installer surum, DB, app deployment ve TLS/Let's Encrypt butunlugunu CI uzerinde dogrulamak
# 📌 Modul - YAML
# Version: 1.6.0
# Aciklama: Native/Docker, DB scope, TLS resolver, HTTPS Compose, renewal artifact ve runtime profili testlerini calistirir
# Bagimli Oldugu Katman: Repo | Tool | View | Config | Language

name: NopCommerce Current Installer

on:
  pull_request:
    paths:
      - "NopCommerce/current/installer/**"
      - "NopCommerce/current/README.md"
      - "NopCommerce/README.md"
      - ".github/workflows/nopcommerce-current-installer.yml"
  push:
    branches:
      - master
    paths:
      - "NopCommerce/current/installer/**"
      - "NopCommerce/current/README.md"
      - "NopCommerce/README.md"
      - ".github/workflows/nopcommerce-current-installer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          find NopCommerce/current/installer             -type f             -name "*.sh"             -print0 | while IFS= read -r -d "" file; do
              bash -n "$file"
            done

          bash -n NopCommerce/current/installer/config/installer.env.example
          bash -n NopCommerce/current/installer/config/version-catalog.env
          bash -n NopCommerce/current/installer/config/database-catalog.env
          bash -n NopCommerce/current/installer/config/application-catalog.env
          bash -n NopCommerce/current/installer/config/tls-catalog.env
          bash -n NopCommerce/current/installer/language/tr.labels

          find NopCommerce/current/installer/config/database             -type f             -name "*.env.example"             -print0 | while IFS= read -r -d "" file; do
              bash -n "$file"
            done

      - name: Validate config load
        shell: bash
        run: |
          set -Eeuo pipefail

          source NopCommerce/current/installer/config/installer.env.example
          source NopCommerce/current/installer/config/version-catalog.env
          source NopCommerce/current/installer/config/database-catalog.env
          source NopCommerce/current/installer/config/application-catalog.env
          source NopCommerce/current/installer/config/tls-catalog.env
          source NopCommerce/current/installer/language/tr.labels

          test "$NOP_APP_MODE" = "native"
          test "$NOP_DB_MODE" = "external"
          test "$NOP_TLS_MODE" = "off"
          test "$NOP_TLS_CERTBOT_IMAGE" = "certbot/certbot:v5.8.0"
          test "$NOP_DOCKER_STACK_HTTPS_PORT" = "443"
          test "$NOP_DB_DOCKER_MYSQL_IMAGE" = "mysql:8.4"
          test "$NOP_DB_DOCKER_POSTGRESQL_IMAGE" = "postgres:17"
          test "$NOP_DOCKER_STACK_NGINX_IMAGE" = "nginx:1.30.5-alpine"
          test -n "$NOP_TLS_MODES"
          test -n "$NOP_APT_TLS_PACKAGES"
          test -n "$ERR_TLS_DOMAIN"

      - name: Validate version and application resolver
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"

          version_repository_resolve "4.30"
          application_repository_resolve_mode "docker"
          test "$NOP_DOCKER_APP_RUNTIME_IMAGE" = "mcr.microsoft.com/dotnet/core/aspnet:3.1-alpine"
          test "$NOP_DOCKER_APP_RUNTIME_PROFILE" = "legacy31"

          version_repository_resolve "4.60.6"
          application_repository_resolve_mode "docker"
          test "$NOP_DOCKER_APP_RUNTIME_IMAGE" = "mcr.microsoft.com/dotnet/aspnet:7.0-alpine"
          test "$NOP_DOCKER_APP_RUNTIME_PROFILE" = "runtime70"

          version_repository_resolve "4.90.8"
          application_repository_resolve_mode "docker"
          test "$NOP_DOCKER_APP_RUNTIME_IMAGE" = "mcr.microsoft.com/dotnet/aspnet:9.0-alpine"
          test "$NOP_DOCKER_APP_RUNTIME_PROFILE" = "runtime90gcompat"

          version_repository_resolve "beta"
          application_repository_resolve_mode "docker"
          test "$NOP_DOCKER_APP_RUNTIME_IMAGE" = "mcr.microsoft.com/dotnet/aspnet:10.0-alpine"
          test "$NOP_DOCKER_APP_RUNTIME_PROFILE" = "runtime100"

          application_repository_resolve_mode "native"
          test "$NOP_APP_MODE_RESOLVED" = "native"

          if application_repository_resolve_mode "invalid"; then
            exit 1
          fi

      - name: Validate TLS resolver
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/config/tls-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"
          source "$INSTALLER_ROOT/repositories/tls_repository.sh"

          version_repository_resolve "4.90.8"
          application_repository_resolve_mode "native"
          tls_repository_resolve_mode "off"
          test "$NOP_TLS_MODE_RESOLVED" = "off"

          NOP_TLS_DOMAIN="shop.example.com"
          NOP_TLS_EMAIL="admin@example.com"

          tls_repository_resolve_mode "letsencrypt"
          test "$NOP_PUBLIC_HOST" = "shop.example.com"
          test "$NOP_TLS_CERT_ROOT_RESOLVED" = "/etc/letsencrypt"
          test "$NOP_TLS_FULLCHAIN_PATH" = "/etc/letsencrypt/live/shop.example.com/fullchain.pem"

          application_repository_resolve_mode "docker"
          tls_repository_resolve_mode "letsencrypt"
          test "$NOP_TLS_CERT_ROOT_RESOLVED" = "/opt/nopcommerce/docker/tls/letsencrypt"
          test "$NOP_TLS_NGINX_CERT_ROOT_RESOLVED" = "/etc/letsencrypt"
          test "$NOP_TLS_FULLCHAIN_PATH" = "/etc/letsencrypt/live/shop.example.com/fullchain.pem"

          NOP_TLS_DOMAIN="invalid"
          if tls_repository_resolve_mode "letsencrypt"; then
            exit 1
          fi

          NOP_TLS_DOMAIN="shop.example.com"
          NOP_TLS_EMAIL="invalid"
          if tls_repository_resolve_mode "letsencrypt"; then
            exit 1
          fi

          if tls_repository_resolve_mode "invalid"; then
            exit 1
          fi

      - name: Validate database compatibility and connection scopes
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/database-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/database_repository.sh"

          NOP_DB_SECRET_FILE="$RUNNER_TEMP/mysql-docker.secret.env"
          printf "%s\n"             "NOP_DB_PASSWORD='app-password'"             "NOP_DB_ROOT_PASSWORD='root-password'" > "$NOP_DB_SECRET_FILE"
          chmod 600 "$NOP_DB_SECRET_FILE"

          version_repository_resolve "4.30"
          database_repository_resolve_provider "mysql"
          database_repository_resolve_mode "docker"

          database_repository_prepare_connection "host"
          test "$NOP_DB_CONNECTION_STRING" = "Server=127.0.0.1;Port=3306;Database=nopcommerce;User=nopcommerce;Password=app-password;SslMode=Preferred"

          database_repository_prepare_connection "stack"
          test "$NOP_DB_CONNECTION_STRING" = "Server=database;Port=3306;Database=nopcommerce;User=nopcommerce;Password=app-password;SslMode=Preferred"

          if database_repository_resolve_provider "postgresql"; then
            exit 1
          fi

          version_repository_resolve "4.40"
          database_repository_resolve_provider "postgresql"
          database_repository_resolve_mode "docker"
          database_repository_prepare_connection "stack"
          test "$NOP_DB_CONNECTION_STRING" = "Host=database;Port=5432;Database=nopcommerce;Username=nopcommerce;Password=app-password"

      - name: Validate external database settings generation
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/database-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/database_repository.sh"

          NOP_CURRENT_DIR="$RUNNER_TEMP/native-current"
          NOP_TEMP_DIR="$RUNNER_TEMP/native-tmp"
          NOP_SERVICE_USER="$(id -un)"
          NOP_SERVICE_GROUP="$(id -gn)"
          NOP_DB_SECRET_FILE="$RUNNER_TEMP/external-db.secret.env"

          mkdir -p "$NOP_CURRENT_DIR/App_Data"

          printf "%s\n"             "NOP_DB_CONNECTION_STRING='Server=db.example.test;Database=nop;User=test;Password=test'"             > "$NOP_DB_SECRET_FILE"
          chmod 600 "$NOP_DB_SECRET_FILE"

          version_repository_resolve "4.90.8"
          database_repository_resolve_provider "sqlserver"
          database_repository_resolve_mode "external"
          database_repository_prepare_connection
          database_repository_write_settings

          test "$(jq -r '.DataProvider' "$NOP_CURRENT_DIR/App_Data/dataSettings.json")" = "SqlServer"
          test "$(stat -c '%a' "$NOP_CURRENT_DIR/App_Data/dataSettings.json")" = "600"

      - name: Validate full Docker HTTP Compose generation
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose version

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/database-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/config/tls-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/database_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"
          source "$INSTALLER_ROOT/repositories/tls_repository.sh"
          source "$INSTALLER_ROOT/tools/docker_stack_tool.sh"

          NOP_RELEASES_DIR="$RUNNER_TEMP/http-releases"
          NOP_CURRENT_DIR="$RUNNER_TEMP/http-current"
          NOP_TEMP_DIR="$RUNNER_TEMP/http-tmp"
          NOP_DOCKER_STACK_ROOT="$RUNNER_TEMP/http-docker"
          NOP_DOCKER_STACK_PERSIST_ROOT="$RUNNER_TEMP/http-docker/persist"
          NOP_DOCKER_STACK_COMPOSE_FILE="$RUNNER_TEMP/http-docker/docker-compose.yml"
          NOP_DOCKER_STACK_NGINX_CONFIG="$RUNNER_TEMP/http-docker/nginx.conf"
          NOP_SERVICE_USER="$(id -un)"
          NOP_SERVICE_GROUP="$(id -gn)"
          NOP_DB_SECRET_FILE="$RUNNER_TEMP/mysql-stack.secret.env"

          mkdir -p             "$NOP_RELEASES_DIR/4.90.8/App_Data/DataProtectionKeys"             "$NOP_RELEASES_DIR/4.90.8/Plugins"             "$NOP_RELEASES_DIR/4.90.8/logs"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/bundles"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/db_backups"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/files/exportimport"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/icons"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/images"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/sitemaps"

          touch "$NOP_RELEASES_DIR/4.90.8/Nop.Web.dll"
          ln -s "$NOP_RELEASES_DIR/4.90.8" "$NOP_CURRENT_DIR"

          printf "%s\n"             "NOP_DB_PASSWORD='app-password'"             "NOP_DB_ROOT_PASSWORD='root-password'" > "$NOP_DB_SECRET_FILE"
          chmod 600 "$NOP_DB_SECRET_FILE"

          version_repository_resolve "4.90.8"
          application_repository_resolve_mode "docker"
          tls_repository_resolve_mode "off"
          database_repository_resolve_provider "mysql"
          database_repository_resolve_mode "docker"
          database_repository_prepare_connection "stack"
          export NOP_DB_NAME NOP_DB_USER

          docker_stack_tool_validate_config
          docker_stack_tool_prepare_persistent_data
          database_repository_write_settings "$NOP_DOCKER_STACK_PERSIST_ROOT"
          docker_stack_tool_write_dockerfile
          docker_stack_tool_write_nginx_config "http"
          docker_stack_tool_write_compose

          docker compose             -p "$NOP_DOCKER_STACK_PROJECT"             -f "$NOP_DOCKER_STACK_COMPOSE_FILE"             config -q

          grep -q 'image: "mysql:8.4"' "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD"' "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q '"0.0.0.0:80:80"' "$NOP_DOCKER_STACK_COMPOSE_FILE"

          if grep -q ':443"' "$NOP_DOCKER_STACK_COMPOSE_FILE"; then
            exit 1
          fi

          if grep -q '3306:3306' "$NOP_DOCKER_STACK_COMPOSE_FILE"; then
            exit 1
          fi

          grep -q 'proxy_pass http://app:80;' "$NOP_DOCKER_STACK_NGINX_CONFIG"

      - name: Validate full Docker TLS Compose generation
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/database-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/config/tls-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/database_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"
          source "$INSTALLER_ROOT/repositories/tls_repository.sh"
          source "$INSTALLER_ROOT/tools/tls_tool.sh"
          source "$INSTALLER_ROOT/tools/docker_stack_tool.sh"

          NOP_RELEASES_DIR="$RUNNER_TEMP/tls-releases"
          NOP_CURRENT_DIR="$RUNNER_TEMP/tls-current"
          NOP_TEMP_DIR="$RUNNER_TEMP/tls-tmp"
          NOP_DOCKER_STACK_ROOT="$RUNNER_TEMP/tls-docker"
          NOP_DOCKER_STACK_PERSIST_ROOT="$RUNNER_TEMP/tls-docker/persist"
          NOP_DOCKER_STACK_COMPOSE_FILE="$RUNNER_TEMP/tls-docker/docker-compose.yml"
          NOP_DOCKER_STACK_NGINX_CONFIG="$RUNNER_TEMP/tls-docker/nginx.conf"
          NOP_TLS_DOCKER_CERT_ROOT="$RUNNER_TEMP/tls-docker/tls/letsencrypt"
          NOP_TLS_DOCKER_WEBROOT="$RUNNER_TEMP/tls-docker/tls/webroot"
          NOP_SERVICE_USER="$(id -un)"
          NOP_SERVICE_GROUP="$(id -gn)"
          NOP_TLS_DOMAIN="shop.example.com"
          NOP_TLS_EMAIL="admin@example.com"

          mkdir -p             "$NOP_RELEASES_DIR/4.90.8/App_Data/DataProtectionKeys"             "$NOP_RELEASES_DIR/4.90.8/Plugins"             "$NOP_RELEASES_DIR/4.90.8/logs"             "$NOP_RELEASES_DIR/4.90.8/wwwroot/images"

          touch "$NOP_RELEASES_DIR/4.90.8/Nop.Web.dll"
          ln -s "$NOP_RELEASES_DIR/4.90.8" "$NOP_CURRENT_DIR"

          version_repository_resolve "4.90.8"
          application_repository_resolve_mode "docker"
          tls_repository_resolve_mode "letsencrypt"
          database_repository_resolve_provider "web"
          database_repository_resolve_mode "external"

          tls_tool_prepare_directories
          docker_stack_tool_validate_config
          docker_stack_tool_prepare_persistent_data
          docker_stack_tool_write_dockerfile
          docker_stack_tool_write_nginx_config "http"
          docker_stack_tool_write_compose

          docker compose             -p "$NOP_DOCKER_STACK_PROJECT"             -f "$NOP_DOCKER_STACK_COMPOSE_FILE"             config -q

          grep -q '"0.0.0.0:80:80"' "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q '"0.0.0.0:443:443"' "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q "$NOP_TLS_DOCKER_WEBROOT:/var/www/certbot:ro" "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q "$NOP_TLS_DOCKER_CERT_ROOT:/etc/letsencrypt:ro" "$NOP_DOCKER_STACK_COMPOSE_FILE"
          grep -q 'root /var/www/certbot;' "$NOP_DOCKER_STACK_NGINX_CONFIG"

          mkdir -p "$NOP_TLS_DOCKER_CERT_ROOT/live/shop.example.com"
          touch             "$NOP_TLS_DOCKER_CERT_ROOT/live/shop.example.com/fullchain.pem"             "$NOP_TLS_DOCKER_CERT_ROOT/live/shop.example.com/privkey.pem"

          docker_stack_tool_write_nginx_config "tls"

          grep -q 'listen 443 ssl;' "$NOP_DOCKER_STACK_NGINX_CONFIG"
          grep -q 'ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;' "$NOP_DOCKER_STACK_NGINX_CONFIG"
          grep -q 'return 301 https://$host$request_uri;' "$NOP_DOCKER_STACK_NGINX_CONFIG"
          grep -q 'Strict-Transport-Security' "$NOP_DOCKER_STACK_NGINX_CONFIG"

      - name: Validate renewal artifact generation
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/config/tls-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"
          source "$INSTALLER_ROOT/repositories/tls_repository.sh"
          source "$INSTALLER_ROOT/tools/tls_tool.sh"

          NOP_TLS_DOMAIN="shop.example.com"
          NOP_TLS_EMAIL="admin@example.com"
          NOP_TLS_DEPLOY_HOOK="$RUNNER_TEMP/deploy-hook"
          NOP_TLS_RENEW_SCRIPT="$RUNNER_TEMP/renew-script"
          NOP_TLS_DOCKER_CERT_ROOT="$RUNNER_TEMP/certs"
          NOP_TLS_DOCKER_WEBROOT="$RUNNER_TEMP/webroot"
          NOP_DB_SECRET_FILE="$RUNNER_TEMP/db.secret.env"

          version_repository_resolve "4.90.8"
          application_repository_resolve_mode "native"
          tls_repository_resolve_mode "letsencrypt"
          tls_tool_write_deploy_hook
          tls_tool_write_renew_script

          bash -n "$NOP_TLS_DEPLOY_HOOK"
          bash -n "$NOP_TLS_RENEW_SCRIPT"
          grep -q 'certbot.*renew\|renew' "$NOP_TLS_RENEW_SCRIPT"
          grep -q -- '--deploy-hook' "$NOP_TLS_RENEW_SCRIPT"

          application_repository_resolve_mode "docker"
          tls_repository_resolve_mode "letsencrypt"
          tls_tool_write_deploy_hook
          tls_tool_write_renew_script

          bash -n "$NOP_TLS_DEPLOY_HOOK"
          bash -n "$NOP_TLS_RENEW_SCRIPT"
          grep -q 'certbot/certbot:v5.8.0' "$NOP_TLS_RENEW_SCRIPT"
          grep -q '.nopcommerce-renewed' "$NOP_TLS_RENEW_SCRIPT"
          grep -q 'docker.*compose\| compose ' "$NOP_TLS_DEPLOY_HOOK"

      - name: Validate legacy Docker runtime profiles
        shell: bash
        run: |
          set -Eeuo pipefail

          export INSTALLER_ROOT="$PWD/NopCommerce/current/installer"

          source "$INSTALLER_ROOT/config/installer.env.example"
          source "$INSTALLER_ROOT/config/version-catalog.env"
          source "$INSTALLER_ROOT/config/application-catalog.env"
          source "$INSTALLER_ROOT/language/tr.labels"
          source "$INSTALLER_ROOT/views/console_view.sh"
          source "$INSTALLER_ROOT/repositories/version_repository.sh"
          source "$INSTALLER_ROOT/repositories/application_repository.sh"
          source "$INSTALLER_ROOT/tools/docker_stack_tool.sh"

          NOP_RELEASES_DIR="$RUNNER_TEMP/legacy-releases"

          for VERSION in 4.30 4.50.4 4.70.5 5.00.0-beta; do
            mkdir -p "$NOP_RELEASES_DIR/$VERSION"
            touch "$NOP_RELEASES_DIR/$VERSION/Nop.Web.dll"
            version_repository_resolve "$VERSION"
            application_repository_resolve_mode "docker"
            docker_stack_tool_write_dockerfile
          done

          grep -q '^FROM mcr.microsoft.com/dotnet/core/aspnet:3.1-alpine$'             "$NOP_RELEASES_DIR/4.30/$NOP_DOCKER_STACK_DOCKERFILE_RELATIVE"

          grep -q 'ld-linux-x86-64.so.2'             "$NOP_RELEASES_DIR/4.50.4/$NOP_DOCKER_STACK_DOCKERFILE_RELATIVE"

          grep -q 'icu-data-full'             "$NOP_RELEASES_DIR/4.70.5/$NOP_DOCKER_STACK_DOCKERFILE_RELATIVE"

          grep -q '^FROM mcr.microsoft.com/dotnet/aspnet:10.0-alpine$'             "$NOP_RELEASES_DIR/5.00.0-beta/$NOP_DOCKER_STACK_DOCKERFILE_RELATIVE"

      - name: Validate templates
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q "__APP_DIR__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__DOTNET_EXECUTABLE__" NopCommerce/current/installer/config/nopcommerce.service.tpl
          grep -q "__DOTNET_ROOT__" NopCommerce/current/installer/config/nopcommerce.service.tpl

          grep -q "__ACME_WEBROOT__" NopCommerce/current/installer/config/nginx.conf.tpl
          grep -q "__TLS_FULLCHAIN__" NopCommerce/current/installer/config/nginx.tls.conf.tpl
          grep -q "__TLS_PRIVKEY__" NopCommerce/current/installer/config/nginx.tls.conf.tpl

          grep -q "__ACME_WEBROOT__" NopCommerce/current/installer/config/docker/nginx.conf.tpl
          grep -q "__TLS_FULLCHAIN__" NopCommerce/current/installer/config/docker/nginx.tls.conf.tpl
          grep -q "__APP_SERVICE__" NopCommerce/current/installer/config/docker/nginx.tls.conf.tpl

          grep -q "__RENEW_SCRIPT__" NopCommerce/current/installer/config/tls-renew.service.tpl
          grep -q "__ON_CALENDAR__" NopCommerce/current/installer/config/tls-renew.timer.tpl
          grep -q "__RANDOM_DELAY__" NopCommerce/current/installer/config/tls-renew.timer.tpl
