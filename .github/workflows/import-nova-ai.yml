# 📄 Dosya Yolu: /Configs/.github/workflows/import-nova-ai.yml
# 📌 Amac: nova.ai deposunu Configs/nova.ai klasorune eksiksiz aktarmak
# 📌 Tool - YAML
# Version: 1.0.0
# Aciklama: Gecici GitHub Actions import workflow'u
# Bagimli Oldugu Katman: Tool

name: Import nova.ai into Configs

on:
  push:
    branches:
      - chore/import-nova-ai

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Configs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import nova.ai repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp-nova-ai nova.ai
          git clone --depth 1 https://github.com/b1glord/nova.ai.git .tmp-nova-ai
          rm -rf .tmp-nova-ai/.git

          mkdir -p nova.ai
          cp -a .tmp-nova-ai/. nova.ai/
          rm -rf .tmp-nova-ai

          rm -f .github/workflows/import-nova-ai.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(configs): import nova.ai repository"
          git push origin HEAD:chore/import-nova-ai
